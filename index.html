<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="color-scheme" content="dark">
	<meta name="theme-color" content="#050a07">
	<title>Tally Up</title>
	<link rel="stylesheet" href="css/style.css">
	<script src="js/script.js" defer></script>
</head>

<body>
	<header>
		<div class="topBar">
			<!-- Budget name -->
			<input class="calcName" id="calcName" value="My Monthly Budget" aria-label="Budget name">

			<p class="tagline">Add amounts, watch the total. Saved on this device.</p>

			<!-- Currency selector. Changes the symbol only, no exchange rates yet -->
			<select class="currencySelect" id="currency" aria-label="Currency">
				<option value="USD">$ USD</option>
				<option value="EUR">&euro; EUR</option>
				<option value="GBP">&pound; GBP</option>
				<option value="CAD">$ CAD</option>
				<option value="MXN">$ MXN</option>
				<option value="CNY">&yen; CNY</option>
				<option value="THB">&#3647; THB</option>
				<option value="INR">&#8377; INR</option>
				<option value="KES">KSh KES</option>
			</select>

			<!-- Total of all amounts -->
			<output class="moneyTotal" id="total" aria-live="polite">$0.00</output>
		</div>
	</header>

	<main class="coreContainer">
		<!-- New item. Press Enter in either field to add -->
		<form id="newItem" class="new">
			<input class="moneyValue" id="newAmount" name="amount" type="text" inputmode="decimal" autocomplete="off" placeholder="Amount" aria-label="Amount">
			<input class="labelValue" id="newLabel" name="label" type="text" autocomplete="off" placeholder="Label this item" aria-label="Label">
			<button class="green button" type="submit">Add</button>
		</form>

		<!-- Saved items are built by js/script.js -->
		<section id="items" class="items" aria-label="Items"></section>
		<p id="empty" class="empty">No items yet. Enter an amount and a label above.</p>
	</main>

	<nav>
		<ul>
			<li><a class="active-tab tab1" href="#" aria-current="page">Calculate</a></li>
			<li><a class="tab2" href="#" aria-disabled="true" tabindex="-1">Tips</a></li>
			<li><a class="tab3" href="#" aria-disabled="true" tabindex="-1">Settings</a></li>
			<li><a class="tab4" href="#" aria-disabled="true" tabindex="-1">Share</a></li>
		</ul>
	</nav>
</body>
</html>
